<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ procedure.has_title[0] }}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Enable smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Make the step navigation sticky */
        .step-navigation {
            position: -webkit-sticky; /* For Safari */
            position: sticky;
            top: 0;
            background-color: white;
            padding: 10px;
            z-index: 1000;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Procedure: {{ procedure.has_title[0] }}</h1>

        <!-- Editing Tools Section -->
        <h3>Edit Tools:</h3>
        <form action="{{ url_for('edit_tools', procedure_title=procedure.has_title[0]) }}" method="POST">
            <ul>
                {% for tool in procedure.has_tool %}
                <li>
                    <input type="text" name="tool_titles" value="{{ tool | replace('repair_ontology.', '') }}" class="form-control">
                    <button type="submit" name="action" value="delete_tool" class="btn btn-danger btn-sm mt-2">Remove</button>
                </li>
                {% endfor %}
            </ul>
            <button type="submit" name="action" value="update_tools" class="btn btn-primary">Update Tools</button>
        </form>

        <!-- Editing Steps Section -->
        <h3>Edit Steps:</h3>
        <form action="{{ url_for('edit_steps', procedure_title=procedure.has_title[0]) }}" method="POST">
            <ol>
                {% for step in procedure.has_step %}
                <li>
                    <input type="text" name="step_titles" value="{{ step.has_title[0] }}" class="form-control">
                    <h4>Images:</h4>
                    <ul>
                        {% for image in step.has_image %}
                        <li>
                            <input type="text" name="step_images" value="{{ image | replace('repair_ontology.', '') }}" class="form-control">
                            <button type="submit" name="action" value="delete_image" class="btn btn-danger btn-sm mt-2">Remove</button>
                        </li>
                        {% endfor %}
                    </ul>
                    <button type="submit" name="action" value="delete_step" class="btn btn-danger btn-sm mt-2">Remove Step</button>
                </li>
                {% endfor %}
            </ol>
            <button type="submit" name="action" value="update_steps" class="btn btn-primary">Update Steps</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Items</a>
    </div>
</body>
</html>
